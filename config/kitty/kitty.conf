# Font Configuration
font_family      SF Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Native Transparency (0.0 is fully clear, 1.0 is fully solid)
background_opacity 0.5

# Remove OS Close Window / Titlebar / Border Decor
hide_window_decorations yes

# Confirm window closing protocol without prompts (optional)
confirm_os_window_close 0
