[colors]
# Pure monochrome palette
background = #1a1a1a
foreground = #ffffff
primary = #ffffff
dim-grey = #707070

# Urgent alert color (stark white on a clean grey block for high-contrast monochrome notification)
urgent-bg = #ffffff
urgent-fg = #1a1a1a

[bar/mybar]
# Force the bar to the bottom
bottom = true

# Center the bar container horizontally
width = 80%
offset-x = 10%

# Offset the bar 20px from the bottom edge of the screen
offset-y = 8px

height = 22pt
radius = 4

# Border padding setup
border-size = 1pt
border-color = ${colors.primary}

background = ${colors.background}
foreground = ${colors.foreground}

padding-left = 2
padding-right = 2
module-margin = 2

font-0 = "SF Mono Nerd Font:size=10;2"

# All modules placed cleanly in the center sequence
modules-left = xworkspaces 
modules-center =  xwindow 
modules-right = cpu ram date

wm-restack = generic
override-redirect = true

[module/xworkspaces]
type = internal/xworkspaces

# Active workspace styling
label-active = %name%
label-active-background = ${colors.primary}
label-active-foreground = ${colors.background}
label-active-padding = 1

# Occupied workspaces
label-occupied = %name%
label-occupied-padding = 1
label-occupied-foreground = ${colors.foreground}

# Empty workspaces
label-urgent = %name%
label-urgent-background = ${colors.urgent-bg}
label-urgent-foreground = ${colors.urgent-fg}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.dim-grey}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.dim-grey}

[module/cpu]
type = internal/cpu
interval = 1
# Clean text/ASCII micro-meter layout
format-prefix = "   [CPU] "
format-prefix-foreground = ${colors.dim-grey}
label = %percentage:2%%

[module/ram]
type = internal/memory
interval = 1
format-prefix = " [RAM] "
format-prefix-foreground = ${colors.dim-grey}
label = %percentage_used:2%%

[module/date]
type = internal/date
interval = 1.0
date = │ %H:%M
label = %date%
label-foreground = ${colors.primary}
